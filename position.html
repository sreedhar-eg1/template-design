<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position</title>
</head>
<body style="height: 3000px; margin: 0; padding-left: 90px; padding-top: 70px;">
    <div style="background-color: black; color: white; position: fixed; top: 5px; left: 0px; right: 0px; height: 50px;">Header</div>
    <div style="background-color: aqua; color: black; position: fixed; top: 55px; bottom: 10px; left: 0px; width: 80px;">Sidebar
        <div style="position: absolute; top: 0; right: 5px; background-color: blanchedalmond;">X</div>
    </div>
    <div style="width: 200px; height: 200px; background-color: lightblue; position: static;">Div 1</div>
    <div style="width: 200px; height: 200px; background-color: lightcoral;">Div 2</div>
</body>
</html>
